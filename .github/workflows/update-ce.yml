name: Update Cisco CE Watch
on:
  schedule:
    - cron: '0 0 * * *'  # 09:00 Asia/Seoul daily (UTC 00:00)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cisco-ce-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover recent Cisco CE posts
        run: python scripts/update_ce.py
      - name: Commit updated data
        run: |
          if [[ -n "$(git status --porcelain -- data/posts.json data/status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posts.json data/status.json
            git commit -m "chore: daily Cisco CE discovery"
            git push
          else
            echo "No data changes"
          fi
